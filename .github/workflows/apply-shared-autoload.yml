name: Apply shared autoload

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-shared-autoload.yml'
      - 'scripts/apply-shared-autoload.py'
      - 'services/baobabSharedStorage.ts'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply-shared-autoload.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(shared): load/save + auto-load when ?baobab=shared"
          git push origin HEAD:main
