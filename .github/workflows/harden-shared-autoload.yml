name: Harden shared autoload

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden-shared-autoload.yml'
      - 'scripts/harden-shared-autoload.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/harden-shared-autoload.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(shared): more reliable auto-load from baobab shared storage"
          git push origin HEAD:main
