name: Apply anafim theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write baobab-tokens.css
        run: |
          cat > baobab-tokens.css << 'EOF'
          /**
           * baobab-tokens.css — anafim (ענפים) shared design tokens
           */
          :root {
            --bg: #f8f7f3;
            --paper: #ffffff;
            --paper-warm: #fefefb;
            --canvas: #fafcf7;
            --text: #29392f;
            --muted: #82877e;
            --subtle: #a4a79f;
            --line: #e7e8e0;
            --line-strong: #d6e2cd;
            --green: #456352;
            --green-deep: #315b48;
            --green-light: #edf1e9;
            --green-active: #e9f0e5;
            --clay: #ac694c;
            --clay-dark: #93583f;
            --clay-light: #f8eee5;
            --shadow: 0 4px 18px #29392f14;
            --shadow-sm: 0 2px 7px #344d2508;
            --font-sans: "Heebo", system-ui, -apple-system, Arial, sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --focus-ring: #b47e59;
          }
          EOF

      - name: Write index.css
        run: |
          cat > index.css << 'EOF'
          @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap');
          @import "tailwindcss";
          @import "./baobab-tokens.css";

          @theme {
            --font-sans: "Heebo", system-ui, sans-serif;
            --color-cream: #f8f7f3;
            --color-sage: #456352;
            --color-clay: #ac694c;
            --color-ink: #29392f;
            --color-muted: #82877e;
            --color-line: #e7e8e0;
          }

          html, body, #root { height: 100%; margin: 0; }
          body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
          }

          .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
          .custom-scrollbar::-webkit-scrollbar-track { background: #edf1e9; }
          .custom-scrollbar::-webkit-scrollbar-thumb { background: #c5b8a0; border-radius: 10px; }
          .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a89a7e; }
          .overflow-y-auto { -webkit-overflow-scrolling: touch; }
          ::selection { background: #e3d3bd; color: var(--text); }
          EOF

      - name: Update index.html body
        run: |
          python3 << 'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          html = html.replace(
              'class="bg-gray-900 text-gray-100 overflow-hidden"',
              'class="bg-[#f8f7f3] text-[#29392f] overflow-hidden baobab-light"',
          )
          html = html.replace('<title>Graph Analysis Tool</title>', '<title>GedShield — מגן אילן</title>')
          # ensure Heebo is available early
          if 'Heebo' not in html:
              html = html.replace(
                  '<meta name="viewport"',
                  '<link rel="preconnect" href="https://fonts.googleapis.com">\n    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n    <meta name="viewport"',
              )
          Path('index.html').write_text(html)
          print('index.html OK')
          PY

      - name: Restyle UI components
        run: |
          cat > components/ui/Button.tsx << 'EOF'
          import React from 'react';

          interface ButtonProps extends React.ButtonHTMLAttributes<HTMLButtonElement> {
            children: React.ReactNode;
            icon?: React.ReactNode;
            variant?: 'primary' | 'secondary';
          }

          const Button: React.FC<ButtonProps> = ({ children, icon, variant = 'primary', ...props }) => {
            const baseStyles =
              'w-full flex items-center justify-center gap-2 px-4 py-2.5 text-xs font-semibold tracking-wide rounded-xl shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#f8f7f3] disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98]';

            const variants = {
              primary:
                'bg-[#ac694c] text-white hover:bg-[#93583f] focus:ring-[#b47e59] shadow-[0_2px_8px_#ac694c33]',
              secondary:
                'bg-[#edf1e9] text-[#456352] border border-[#d6e2cd] hover:bg-[#e9f0e5] focus:ring-[#456352]',
            };

            return (
              <button {...props} className={`${baseStyles} ${variants[variant]}`}>
                {icon}
                {children}
              </button>
            );
          };

          export default Button;
          EOF

          cat > components/ui/Card.tsx << 'EOF'
          import React from 'react';

          interface CardProps {
            children: React.ReactNode;
            className?: string;
          }

          const Card: React.FC<CardProps> = ({ children, className = '' }) => {
            return (
              <div
                className={`bg-[#fefefb] border border-[#e7e8e0] shadow-[0_4px_18px_#29392f14] backdrop-blur-sm rounded-2xl ${className}`}
              >
                {children}
              </div>
            );
          };

          export default Card;
          EOF

          cat > components/ui/Spinner.tsx << 'EOF'
          import React from 'react';

          const Spinner: React.FC = () => (
            <svg
              className="animate-spin -ml-1 mr-2 h-5 w-5 text-current"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
              <path
                className="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              />
            </svg>
          );

          export default Spinner;
          EOF

      - name: Soften App chrome colors (light anafim)
        run: |
          python3 << 'PY'
          from pathlib import Path

          # Global class replacements for dark→anafim light in App + ControlPanel
          files = ['App.tsx', 'components/ControlPanel.tsx', 'components/GraphLegend.tsx', 'components/SampleDataSelector.tsx']
          reps = [
              ('bg-gray-950', 'bg-[#f8f7f3]'),
              ('bg-gray-900', 'bg-[#fefefb]'),
              ('bg-gray-800', 'bg-[#edf1e9]'),
              ('bg-gray-700', 'bg-[#e7e8e0]'),
              ('text-white', 'text-[#29392f]'),
              ('text-gray-100', 'text-[#29392f]'),
              ('text-gray-200', 'text-[#29392f]'),
              ('text-gray-300', 'text-[#657157]'),
              ('text-gray-400', 'text-[#82877e]'),
              ('text-gray-500', 'text-[#82877e]'),
              ('border-gray-800', 'border-[#e7e8e0]'),
              ('border-gray-700', 'border-[#e7e8e0]'),
              ('border-gray-600', 'border-[#d6e2cd]'),
              ('text-cyan-400', 'text-[#456352]'),
              ('text-cyan-500', 'text-[#456352]'),
              ('text-cyan-300', 'text-[#456352]'),
              ('bg-cyan-600', 'bg-[#ac694c]'),
              ('bg-cyan-500', 'bg-[#ac694c]'),
              ('hover:bg-cyan-500', 'hover:bg-[#93583f]'),
              ('hover:text-cyan-400', 'hover:text-[#456352]'),
              ('hover:text-cyan-300', 'hover:text-[#456352]'),
              ('border-cyan-500', 'border-[#456352]'),
              ('border-cyan-700', 'border-[#d6e2cd]'),
              ('bg-cyan-900/40', 'bg-[#edf1e9]'),
              ('bg-cyan-950/20', 'bg-[#edf1e9]'),
              ('ring-cyan-500', 'ring-[#b47e59]'),
              ('focus:ring-cyan-500', 'focus:ring-[#b47e59]'),
          ]
          for f in files:
              p = Path(f)
              if not p.exists():
                  print('skip', f)
                  continue
              t = p.read_text()
              for a, b in reps:
                  t = t.replace(a, b)
              p.write_text(t)
              print('patched', f, p.stat().st_size)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "style: apply anafim (ענפים) design system — cream/sage/clay"
          git push origin HEAD:main
